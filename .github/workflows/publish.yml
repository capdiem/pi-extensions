name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm Trusted Publishing and provenance: npm authenticates this
  # workflow via GitHub OIDC, so no NPM_TOKEN secret is needed.
  id-token: write

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Build staging packages
        run: bun run build

      - name: Setup Node (npm publisher)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish @capdiem/pi-todo
        run: npm publish dist/pi-todo --access public --provenance

      - name: Publish @capdiem/pi-ask-user
        run: npm publish dist/pi-ask-user --access public --provenance
