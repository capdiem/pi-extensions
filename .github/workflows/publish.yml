name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Validate build + publish without actually publishing to npm"
        type: boolean
        default: false

permissions:
  contents: read
  # Required for npm Trusted Publishing and provenance: npm authenticates this
  # workflow via GitHub OIDC, so no NPM_TOKEN secret is needed.
  id-token: write

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # test script uses node --test-isolation=process (needs Node 22+);
          # must be available before "Run checks" (runner default node is older)
          node-version: 22

      - name: Run checks
        run: bun run check

      - name: Build staging packages
        run: bun run build

      - name: Publish @capdiem/pi-todo
        working-directory: dist/pi-todo
        run: npm publish --access public --provenance ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}

      - name: Publish @capdiem/pi-ask-user
        working-directory: dist/pi-ask-user
        run: npm publish --access public --provenance ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}
